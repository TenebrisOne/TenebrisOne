<svg width="960" height="190" viewBox="0 0 960 190" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" role="img" aria-label="⭐ ¿Te gustó algún proyecto? ¡Dale una estrella! Hecho con amor en Colombia — TenebrisOne"><style>.w1{animation:mv 11s linear infinite}.w2{animation:mv 17s linear infinite reverse}.w3{animation:mv 25s linear infinite}@keyframes mv{to{transform:translateX(-480px)}}.fu{opacity:0;transform:translateY(12px);animation:fu .8s cubic-bezier(.22,1,.36,1) .15s forwards}.fu2{animation-delay:.45s}@keyframes fu{to{opacity:1;transform:none}}.beat{transform-box:fill-box;transform-origin:center;animation:beat 1.6s ease-in-out infinite}@keyframes beat{0%,100%{transform:scale(1)}12%{transform:scale(1.3)}24%{transform:scale(1)}36%{transform:scale(1.2)}48%{transform:scale(1)}}.star{transform-box:fill-box;transform-origin:center;animation:spin 7s ease-in-out infinite}@keyframes spin{0%,100%{transform:rotate(-12deg) scale(1)}50%{transform:rotate(12deg) scale(1.18)}}.tw{animation:tw 3.4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.fu,.in{opacity:1!important;transform:none!important}}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5ee7ff"><animate attributeName="stop-color" values="#5ee7ff;#9d7bff;#ff6ac2;#5ee7ff" dur="8s" repeatCount="indefinite"/></stop><stop offset="50%" stop-color="#9d7bff"><animate attributeName="stop-color" values="#9d7bff;#ff6ac2;#5ee7ff;#9d7bff" dur="8s" repeatCount="indefinite"/></stop><stop offset="100%" stop-color="#ff6ac2"><animate attributeName="stop-color" values="#ff6ac2;#5ee7ff;#9d7bff;#ff6ac2" dur="8s" repeatCount="indefinite"/></stop></linearGradient><filter id="gw" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><circle class="tw" style="animation-delay:0.2s" cx="80" cy="30" r="1.0" fill="#9d7bff"/><circle class="tw" style="animation-delay:1.4s" cx="200" cy="62" r="1.4" fill="#9d7bff"/><circle class="tw" style="animation-delay:2.5s" cx="330" cy="22" r="1.8" fill="#9d7bff"/><circle class="tw" style="animation-delay:0.8s" cx="620" cy="58" r="1.2" fill="#9d7bff"/><circle class="tw" style="animation-delay:1.9s" cx="760" cy="24" r="1.6" fill="#9d7bff"/><circle class="tw" style="animation-delay:0.5s" cx="900" cy="48" r="1.0" fill="#9d7bff"/><circle class="tw" style="animation-delay:2.9s" cx="480" cy="14" r="1.4" fill="#9d7bff"/><g class="fu"><text class="star" x="322" y="46" font-size="22">⭐</text><text x="352" y="46" font-size="22" font-weight="800" fill="url(#g)" filter="url(#gw)">¿Te gustó algún proyecto?</text></g><text class="fu" x="480" y="76" text-anchor="middle" font-size="15" fill="#a3aed6">¡Dale una estrella! Me ayuda a seguir construyendo cosas útiles.</text><g class="fu fu2"><text x="447" y="104" text-anchor="end" font-size="13.5" fill="#5d6791">Hecho con</text><text class="beat" x="455" y="104" font-size="14" fill="#ff6ac2">❤</text><text x="474" y="104" font-size="13.5" fill="#5d6791">en Colombia — TenebrisOne</text></g><g class="w3"><path d="M0 128 Q120 106 240 128 T480 128 T720 128 T960 128 T1200 128 T1440 128 V190 H0 Z" fill="#ff6ac2" opacity="0.16"/></g><g class="w2"><path d="M0 140 Q120 118 240 140 T480 140 T720 140 T960 140 T1200 140 T1440 140 V190 H0 Z" fill="#9d7bff" opacity="0.22"/></g><g class="w1"><path d="M0 152 Q120 130 240 152 T480 152 T720 152 T960 152 T1200 152 T1440 152 V190 H0 Z" fill="#5ee7ff" opacity="0.2"/></g></svg>
<text x="566" y="96" mask="url(#m1)"><tspan fill="#9ece6a">$</tspan><tspan fill="#c0caf5"> whoami</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.028;0.889" dur="18s" repeatCount="indefinite"/></text>

<svg width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" role="img" aria-label="Cristian Ruiz — TenebrisOne · Desarrollador Fullstack · Odoo · VPS">
<style>
.fu{opacity:0;transform:translateY(14px);animation:fu .7s cubic-bezier(.22,1,.36,1) forwards}
@keyframes fu{to{opacity:1;transform:none}}
.d1{animation-delay:.15s}.d2{animation-delay:.3s}.d3{animation-delay:.45s}.d4{animation-delay:.6s}.d5{animation-delay:.78s}
.t{transform:scaleX(0);transform-box:fill-box;transform-origin:0 50%}
.t1{animation:ty .6s steps(9) .7s forwards}
.t2{animation:ty .95s steps(22) 1.9s forwards}
@keyframes ty{to{transform:scaleX(1)}}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.85}}
.flt{animation:flt 7s ease-in-out infinite alternate}
@keyframes flt{to{transform:translateY(-11px)}}
.cur{opacity:0;animation:bl 1.1s steps(1) 4.9s infinite}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
.glow{animation:gl 4.5s ease-in-out infinite}
@keyframes gl{0%,100%{stroke-opacity:.25}50%{stroke-opacity:.75}}
.hw1{animation:hmv 14s linear infinite}
.hw2{animation:hmv 22s linear infinite reverse}
@keyframes hmv{to{transform:translateX(-480px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fu{opacity:1!important;transform:none!important}.t{transform:scaleX(1)!important}.cur{opacity:1!important}}
</style>
<defs>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#7aa2f7"><animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#7dcfff;#7aa2f7" dur="9s" repeatCount="indefinite"/></stop>
<stop offset="50%" stop-color="#bb9af7"><animate attributeName="stop-color" values="#bb9af7;#7dcfff;#7aa2f7;#bb9af7" dur="9s" repeatCount="indefinite"/></stop>
<stop offset="100%" stop-color="#7dcfff"><animate attributeName="stop-color" values="#7dcfff;#7aa2f7;#bb9af7;#7dcfff" dur="9s" repeatCount="indefinite"/></stop>
</linearGradient>
<mask id="m1"><rect class="t t1" x="560" y="82" width="100" height="20" fill="#fff"/></mask>
<mask id="m2"><rect class="t t2" x="560" y="126" width="210" height="22" fill="#fff"/></mask>
<clipPath id="hc"><rect x="0.5" y="0.5" width="959" height="299" rx="16"/></clipPath>
</defs>

<rect x="0.5" y="0.5" width="959" height="299" rx="16" fill="#1a1b27" stroke="#2f334d"/>
<g clip-path="url(#hc)">
<g class="hw2"><path d="M0 268 Q120 252 240 268 T480 268 T720 268 T960 268 T1200 268 T1440 268 V300 H0 Z" fill="#bb9af7" opacity=".05"/></g>
<g class="hw1"><path d="M0 276 Q120 260 240 276 T480 276 T720 276 T960 276 T1200 276 T1440 276 V300 H0 Z" fill="#7aa2f7" opacity=".07"/></g>
</g>
<rect class="glow" x="2" y="2" width="956" height="296" rx="15" fill="none" stroke="url(#g1)" stroke-width="1.5"/>
<rect x="20" y="0" width="920" height="4" rx="2" fill="url(#g1)"/>


<text x="566" y="140" mask="url(#m2)"><tspan fill="#9ece6a">$</tspan><tspan fill="#c0caf5"> ssh vps --deploy all</tspan><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.106;0.889" dur="18s" repeatCount="indefinite"/></text>
<rect x="566" y="152" width="180" height="6" rx="3" fill="#24283b"><animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.164;0.889" dur="18s" repeatCount="indefinite"/></rect>
<rect x="566" y="152" width="0" height="6" rx="3" fill="#9ece6a"><animate attributeName="width" values="0;0;180;180;0" keyTimes="0;0.167;0.217;0.889;0.895" dur="18s" repeatCount="indefinite"/></rect>
<text x="756" y="159" font-size="10" fill="#565f89">100%<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.214;0.889" dur="18s" repeatCount="indefinite"/></text>
<text x="566" y="180" fill="#9ece6a">✔ apache · nginx · ssl · pm2 — ok<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.219;0.889" dur="18s" repeatCount="indefinite"/></text>
<text x="566" y="202" fill="#e0af68">▸ 19+ proyectos en producción<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.242;0.889" dur="18s" repeatCount="indefinite"/></text>
<text x="566" y="226" fill="#9ece6a">$<animate attributeName="opacity" calcMode="discrete" values="0;1;0" keyTimes="0;0.258;0.889" dur="18s" repeatCount="indefinite"/></text>

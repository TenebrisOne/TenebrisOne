<svg width="960" height="48" viewBox="0 0 960 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label=""><style>.beam{animation:br 5s ease-in-out infinite}@keyframes br{0%,100%{opacity:.45}50%{opacity:1}}.comet{animation:cm 6s cubic-bezier(.45,.05,.55,.95) infinite}@keyframes cm{0%{transform:translateX(-80px)}100%{transform:translateX(1040px)}}.dia{transform-box:fill-box;transform-origin:center;animation:rot 9s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}.tw{animation:tw 3.4s ease-in-out infinite}@keyframes tw{0%,100%{opacity:.1}50%{opacity:.9}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.fu,.in{opacity:1!important;transform:none!important}}@media (prefers-reduced-motion:reduce){.comet{opacity:0!important}}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5ee7ff"><animate attributeName="stop-color" values="#5ee7ff;#9d7bff;#ff6ac2;#5ee7ff" dur="8s" repeatCount="indefinite"/></stop><stop offset="50%" stop-color="#9d7bff"><animate attributeName="stop-color" values="#9d7bff;#ff6ac2;#5ee7ff;#9d7bff" dur="8s" repeatCount="indefinite"/></stop><stop offset="100%" stop-color="#ff6ac2"><animate attributeName="stop-color" values="#ff6ac2;#5ee7ff;#9d7bff;#ff6ac2" dur="8s" repeatCount="indefinite"/></stop></linearGradient><filter id="gw" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5ee7ff" stop-opacity="0"/><stop offset="1" stop-color="#5ee7ff" stop-opacity=".85"/></linearGradient></defs><line x1="0" y1="24" x2="960" y2="24" stroke="#5d6791" stroke-opacity=".3" stroke-width="1"/><line class="beam" x1="120" y1="24" x2="840" y2="24" stroke="url(#g)" stroke-width="2.2" stroke-linecap="round" filter="url(#gw)"/><g class="comet"><rect x="-64" y="22.8" width="64" height="2.4" rx="1.2" fill
<svg width="900" height="64" viewBox="0 0 900 64" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" role="img" aria-label="Sobre mí"><style>.ic{transform-box:fill-box;transform-origin:center;animation:fl 2.6s ease-in-out infinite alternate}@keyframes fl{to{transform:translateY(-6px)}}.ttl{opacity:0;transform:translateX(-14px);animation:in .6s cubic-bezier(.22,1,.36,1) .1s forwards}@keyframes in{to{opacity:1;transform:none}}.ul{transform:scaleX(0);transform-box:fill-box;transform-origin:0 50%;animation:gr .7s cubic-bezier(.22,1,.36,1) .5s forwards}@keyframes gr{to{transform:scaleX(1)}}.spark{animation:sp 4.5s ease-in-out 1.2s infinite alternate}@keyframes sp{to{transform:translateX(772px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.ttl{opacity:1!important;transform:none!important}.ul{transform:none!important}}</style><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7aa2f7"><animate attributeName="stop-color" values="#7aa2f7;#bb9af7;#7dcfff;#7aa2f7" dur="9s" repeatCount="indefinite"/></stop><stop offset="100%" stop-color="#bb9af7"><animate attributeName="stop-color" values="#bb9af7;#7dcfff;#7aa2f7;#bb9af7" dur="9s" repeatCount="indefinite"/></stop></linearGradient></defs><text class="ic" x="6" y="44" font-size="32">🚀</text><text class="ttl" x="56" y="44" font-size="30" font-weight="800" fill="url(#g)">Sobre mí</text><rect x="56" y="54" width="832" height="1.5" fill="#7aa2f7" opacity="0.18"/><rect class="ul" x="56" y="52" width="138" height="4.5" rx="2.25" fill="url(#g)"/><g class="spark"><circle cx="60" cy="55" r="7" fill="#7dcfff" opacity="0.25"/><circle cx="60" cy="55" r="3" fill="#7dcfff"/></g></svg>
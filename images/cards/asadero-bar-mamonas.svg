<svg width="420" height="180" viewBox="0 0 420 180" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" role="img" aria-label="asadero-bar-mamonas"><style>.bar{transform:scaleY(0);transform-box:fill-box;transform-origin:center;animation:grow .55s cubic-bezier(.22,1,.36,1) .1s forwards,bpulse 3.4s ease-in-out 2.2s infinite}@keyframes grow{to{transform:scaleY(1)}}@keyframes bpulse{0%,100%{opacity:1}50%{opacity:.5}}.cat{opacity:0;transform:translateX(-10px);animation:in .5s ease .3s forwards}.ttl{opacity:0;transform:translateY(8px);animation:in .5s ease .4s forwards}.bdg{opacity:0;animation:in .5s ease .55s forwards}.ln{opacity:0;transform:translateY(6px);animation:in .45s ease forwards}.chp{opacity:0;transform:translateY(10px);animation:in .4s cubic-bezier(.22,1,.36,1) forwards}@keyframes in{to{opacity:1;transform:none}}.dot{animation:pulse 2.6s ease-in-out 1.4s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}.halo{opacity:0;animation:halo 2.6s ease-out 1.4s infinite}@keyframes halo{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.4)}}.halo{transform-box:fill-box;transform-origin:center}.shine{animation:sweep 6s cubic-bezier(.4,0,.2,1) 1.2s infinite}@keyframes sweep{0%{transform:translateX(0)}26%{transform:translateX(640px)}100%{transform:translateX(640px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.cat,.ttl,.bdg,.ln,.chp{opacity:1!important;transform:none!important}.bar{transform:none!important}.halo,.shine{opacity:0!important}}</style><defs><clipPath id="cp"><rect x="0.5" y="0.5" width="419" height="179" rx="8"/></clipPath><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.08"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs><rect x="0.5" y="0.5" width="419" height="179" rx="8" fill="#1a1b27" stroke="#2f334d"/><rect class="bar" x="0" y="16" width="3.5" height="148" rx="1.75" fill="#7dcfff"/><text class="cat" x="20" y="28" font-size="10" font-weight="700" letter-spacing="1.2" fill="#7dcfff">APP · HERRAMIENTA</text><g class="bdg"><rect x="328" y="14" width="72" height="18" rx="9" fill="#2a302f"/><circle class="halo" cx="339" cy="23" r="3" fill="none" stroke="#9ece6a" stroke-width="1.5"/><circle class="dot" cx="339" cy="23" r="3" fill="#9ece6a"/><text x="346" y="27" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#9ece6a">PÚBLICO</text></g><text class="ttl" x="20" y="56" font-size="17" font-weight="700" fill="#c0caf5">asadero-bar-mamonas</text><text class="ln" style="animation-delay:0.55s" x="20" y="80" font-size="12" fill="#a9b1d6">Sitio web responsive para restaurante, enfocado en</text><text class="ln" style="animation-delay:0.67s" x="20" y="97" font-size="12" fill="#a9b1d6">visibilidad y pedidos online. Desplegado en Firebase</text><text class="ln" style="animation-delay:0.79s" x="20" y="114" font-size="12" fill="#a9b1d6">Hosting.</text><g class="chp" style="animation-delay:0.85s"><rect x="20" y="138" width="41" height="22" rx="6" fill="#24283b"/><text x="40.5" y="153" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7dcfff">HTML</text></g><g class="chp" style="animation-delay:0.95s"><rect x="69" y="138" width="35" height="22" rx="6" fill="#24283b"/><text x="86.5" y="153" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7dcfff">CSS</text></g><g class="chp" style="animation-delay:1.05s"><rect x="112" y="138" width="72" height="22" rx="6" fill="#24283b"/><text x="148.0" y="153" text-anchor="middle" font-size="10.5" font-weight="600" fill="#7dcfff">Bootstrap</text></g><g clip-path="url(#cp)"><g transform="rotate(16)"><rect class="shine" x="-150" y="-120" width="90" height="420" fill="url(#sh)"/></g></g></svg>
<svg width="420" height="190" viewBox="0 0 420 190" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Sans-Serif" role="img" aria-label="mja-landing"><style>.cat{opacity:0;transform:translateX(-10px);animation:in .5s ease .25s forwards}.ttl{opacity:0;transform:translateY(8px);animation:in .5s ease .38s forwards}.bdg{opacity:0;animation:in .5s ease .5s forwards}.ln{opacity:0;transform:translateY(6px);animation:in .45s ease forwards}.chp{opacity:0;transform:translateY(10px);animation:in .4s cubic-bezier(.22,1,.36,1) forwards}@keyframes in{to{opacity:1;transform:none}}.dot{animation:pulse 2.6s ease-in-out 1.4s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}.halo{transform-box:fill-box;transform-origin:center;opacity:0;animation:halo 2.6s ease-out 1.4s infinite}@keyframes halo{0%{opacity:.7;transform:scale(1)}70%,100%{opacity:0;transform:scale(2.4)}}.glowc{animation:gp 5s ease-in-out infinite}@keyframes gp{0%,100%{opacity:.55}50%{opacity:1}}.shine{animation:sweep 6s cubic-bezier(.4,0,.2,1) 1.2s infinite}@keyframes sweep{0%{transform:translateX(0)}26%{transform:translateX(640px)}100%{transform:translateX(640px)}}.arr{animation:arr 1.8s ease-in-out infinite}@keyframes arr{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}.pt{transform-box:fill-box;transform-origin:center;animation:pt 5s ease-in-out infinite alternate}@keyframes pt{to{transform:translateY(-8px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}.cat,.ttl,.bdg,.ln,.chp{opacity:1!important;transform:none!important}.halo,.shine{opacity:0!important}}</style><defs><clipPath id="cp"><rect x="1" y="1" width="418" height="188" rx="13"/></clipPath><linearGradient id="gb" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#5ee7ff"><animate attributeName="stop-color" values="#5ee7ff;#272f55;#5ee7ff;#5ee7ff" dur="6s" repeatCount="indefinite"/></stop><stop offset="50%" stop-color="#272f55"><animate attributeName="stop-color" values="#272f55;#5ee7ff;#5ee7ff;#272f55" dur="6s" repeatCount="indefinite"/></stop><stop offset="100%" stop-color="#5ee7ff"><animate attributeName="stop-color" values="#5ee7ff;#5ee7ff;#272f55;#5ee7ff" dur="6s" repeatCount="indefinite"/></stop></linearGradient><radialGradient id="rg" gradientUnits="userSpaceOnUse" cx="60" cy="0" r="250"><stop offset="0" stop-color="#5ee7ff" stop-opacity=".22"/><stop offset="1" stop-color="#5ee7ff" stop-opacity="0"/></radialGradient><linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity="0.07"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><filter id="gw" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="418" height="188" rx="13" fill="#10162e"/><g clip-path="url(#cp)"><rect class="glowc" x="0" y="0" width="420" height="190" fill="url(#rg)"/></g><rect x="1" y="1" width="418" height="188" rx="13" fill="none" stroke="url(#gb)" stroke-width="1.5"/><rect x="20" y="13" width="104" height="20" rx="10" fill="#1a3149"/><text x="72.0" y="26.5" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1" fill="#5ee7ff">PLATAFORMA WEB</text><g class="bdg"><rect x="328" y="14" width="72" height="18" rx="9" fill="#312e32" stroke="#ffc24b" stroke-opacity=".35"/><circle class="halo" cx="339" cy="23" r="3" fill="none" stroke="#ffc24b" stroke-width="1.5"/><circle class="dot" cx="339" cy="23" r="3" fill="#ffc24b"/><text x="346" y="27" font-size="9.5" font-weight="700" letter-spacing="0.5" fill="#ffc24b">PRIVADO</text></g><text class="ttl" x="20" y="60" font-size="18" font-weight="700" fill="#e6ebff">mja-landing</text><circle class="pt" style="animation-delay:0s" cx="392" cy="62" r="2" fill="#5ee7ff" opacity=".35"/><circle class="pt" style="animation-delay:1.6s" cx="376" cy="96" r="2" fill="#5ee7ff" opacity=".35"/><circle class="pt" style="animation-delay:0.8s" cx="398" cy="128" r="2" fill="#5ee7ff" opacity=".35"/><text class="ln" style="animation-delay:0.55s" x="20" y="84" font-size="12" fill="#a3aed6">Landing page de la plataforma MJA, puerta de entrada y</text><text class="ln" style="animation-delay:0.67s" x="20" y="101" font-size="12" fill="#a3aed6">presentación del producto.</text><g class="chp" style="animation-delay:0.85s"><rect x="20" y="148" width="43" height="22" rx="11" fill="#161c38" stroke="#5ee7ff" stroke-opacity=".4"/><text x="41.5" y="163" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5ee7ff">HTML</text></g><g class="chp" style="animation-delay:0.95s"><rect x="71" y="148" width="37" height="22" rx="11" fill="#161c38" stroke="#5ee7ff" stroke-opacity=".4"/><text x="89.5" y="163" text-anchor="middle" font-size="10.5" font-weight="600" fill="#5ee7ff">CSS</text></g><g clip-path="url(#cp)"><g transform="rotate(16)"><rect class="shine" x="-150" y="-120" width="90" height="440" fill="url(#sh)"/></g></g></svg>
name: Regenerar culebrita y estadísticas

on:
  schedule:
    - cron: "0 5 * * *" # todos los días a las 00:00 hora Colombia
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generar SVG de la culebrita
        run: python3 scripts/gen_snake.py

      - name: Generar tarjetas de estadísticas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/gen_stats.py

      - name: Commit y push si cambió
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/snake.svg images/stats.svg images/top-langs.svg
          git diff --cached --quiet || git commit -m "🤖 Actualiza culebrita y estadísticas"
          git push
